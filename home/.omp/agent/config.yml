modelRoles:
  slow: anthropic/claude-fable-5-1:auto
  designer: openai-codex/gpt-6-sol:auto
  vision: openai-codex/gpt-6-sol:auto
  plan: anthropic/claude-fable-5-1:auto
  default: anthropic/claude-opus-5-5
  smol: openai-codex/gpt-6.1-sol:auto
  task: openai-codex/gpt-5.6-sol:high
  commit: anthropic/claude-sonnet-5-5:auto
  advisor: openai-codex/gpt-6.1-sol:auto
  web: openai-codex/gpt-6.1-sol:auto
  tiny: openai-codex/gpt-6-luna
cycleOrder:
  - tiny
  - smol
  - default
  - slow
theme:
  dark: titanium
edit:
  mode: hashline
symbolPreset: nerd
setupVersion: 3
defaultThinkingLevel: auto
memory:
  backend: "off"
autolearn:
  enabled: false
  autoContinue: true
mnemopi:
  enhancedRecall: true
  proactiveLinking: true
  scoping: global
advisor:
  enabled: false
dev:
  autoqaConsent: denied
statusLine:
  compactThinkingLevel: false
  sessionAccent: true
  transparent: false
hideThinkingBlock: true
task:
  agentAdvisor:
    task: "on"
github:
  enabled: true
composer:
  shape: rule
  predictions: false
display:
  hideToolActivity: false
retry:
  fallbackChains:
    web:
      - web/perplexity
      - google-gemini-cli/gemini-2.5-flash
      - google-antigravity/gemini-2.5-flash
      - google/gemini-2.5-flash
      - anthropic/claude-haiku-4-5
      - xai/grok-4.5
      - web/zai
      - web/exa
      - web/tinyfish
      - web/jina
      - web/kagi
      - web/tavily
      - web/firecrawl
      - web/brave
      - web/kimi
      - web/parallel
      - web/synthetic
      - web/searxng
      - web/startpage
      - web/duckduckgo
      - web/ecosia
      - web/google
      - web/mojeek
      - web/public
      - web/hosted
browser:
  relay: true
session:
  worktreeScope: directory
update:
  auto: true
tools:
  approval:
    aws-write: prompt
    databricks-write: prompt
tui:
  vimMode: true
  resizeScrollback: rebuild
  completeScrollback: false
  titleState: false
terminal:
  showProgress: false
steeringMode: one-at-a-time
followUpMode: one-at-a-time
spelling:
  autocomplete: auto
  autocorrect: false
completion:
  notify: "off"
read:
  renderMarkdown: false
vault:
  enabled: true