# Worktrees as sibling directories to the bare repo
# e.g., mortgage-pos/smort-7283-calendly-infra-spin-down
worktree-path = "{{ repo_path }}/../{{ branch | sanitize }}"

[switch]
cd = false

# ============================================================================
# Global hooks — repo-agnostic. Repo-specific steps live under [projects.*]
# below and APPEND after these (global first, then per-project).
#
# tmux session name: per-branch override via
#   wt config state vars set session=<nickname> --branch=<branch>
# (main in mortgage-pos = "mpos", main in sagehomeloans.com = "sage-website");
# falls back to the sanitized branch name.
# ============================================================================

[[pre-start]]
# Copy gitignored caches/deps from main worktree (reflinks on APFS).
# mortgage-pos excludes node_modules/ (symlinked instead — see its entry).
copyIgnore = '[ -n "${WT_REVIEW_ONLY:-}" ] && exit 0; wt step copy-ignored'

[[pre-start]]
tmux = """
SESSION="{{ vars.session | default(branch | sanitize) }}"
if ! tmux has-session -t "$SESSION" 2>/dev/null; then
  tmux new-session -d -s "$SESSION" -c {{ worktree_path }}
  if [ -n "${WT_REVIEW_ONLY:-}" ]; then
    # 25/75 split plus small pane for deps
    tmux split-window -h -t "$SESSION:0.0" -l 75% -c {{ worktree_path }}
    tmux split-window -v -t "$SESSION:0.1" -l 20% -c {{ worktree_path }}
    tmux select-pane -t "$SESSION:0.0"
  fi
fi
"""

[post-switch]
# Switch tmux session (instant, separate background process)
switchTmuxSesh = """
[ -n "${WT_SKIP_TMUX_SWITCH:-}" ] && exit 0
SESSION="{{ vars.session | default(branch | sanitize) }}"
if tmux has-session -t "$SESSION" 2>/dev/null; then
  tmux select-window -t "$SESSION:0"
  if [ -n "${TMUX:-}" ]; then
    tmux switch-client -t "$SESSION"
  else
    tmux attach-session -t "$SESSION"
  fi
fi
"""

[[pre-remove]]
killNvim = """
for pid in $(ps -eo pid,comm | awk '/nvim/{print $1}'); do
  cwd=$(lsof -p "$pid" 2>/dev/null | awk '$4=="cwd"{print $NF}')
  case "$cwd" in
    {{ worktree_path }}*) kill "$pid" 2>/dev/null || true ;;
  esac
done
"""

[post-remove]
# Kill the tmux session for the removed worktree
tmux = "tmux kill-session -t {{ vars.session | default(branch | sanitize) }} 2>/dev/null || true"

# ============================================================================
# mortgage-pos — pnpm monorepo, symlinked node_modules, per-worktree DB
# opt-in. Servers window starts as 1 empty pane; `wt servers` boots the
# 6-pane full stack (adminUI/adminAPI/justUI/justAPI/bpUI/bpAPI).
# ============================================================================

[projects."github.com/SageHomeLoans/mortgage-pos"]
# node_modules is symlinked from main (below), keep it out of the reflink copy
step.copy-ignored.exclude = ["node_modules/"]

[[projects."github.com/SageHomeLoans/mortgage-pos".pre-start]]
# Symlink node_modules from main worktree (shared deps, no install needed)
symNodeModules = """
[ -n "${WT_REVIEW_ONLY:-}" ] && exit 0
ln -sf {{ primary_worktree_path }}/node_modules {{ worktree_path }}/node_modules
"""

[[projects."github.com/SageHomeLoans/mortgage-pos".pre-start]]
migrations = '[ -n "${WT_REVIEW_ONLY:-}" ] && exit 0; [ -f {{ primary_worktree_path }}/db/migrations-index.ts ] && cp {{ primary_worktree_path }}/db/migrations-index.ts {{ worktree_path }}/db/migrations-index.ts || true'

[[projects."github.com/SageHomeLoans/mortgage-pos".pre-start]]
# Opt-in (the `wtdb` alias sets WT_DB_ISOLATED=1): give this worktree its own
# Postgres DB on the shared local container by cloning the main DB, then
# point its processes at it via a mise env override. No flag => shared mortgage_pos.
isolatedDb = '''
[ -n "${WT_REVIEW_ONLY:-}" ] && exit 0
[ -z "${WT_DB_ISOLATED:-}" ] && exit 0
export PGPASSWORD=pass
PG="psql -h 127.0.0.1 -p 54320 -U user -d postgres -v ON_ERROR_STOP=1"
DB="mortgage_pos_{{ branch | sanitize_db }}"
if ! $PG -tAc "SELECT 1 FROM pg_database WHERE datname='$DB'" | grep -q 1; then
  # CREATE ... TEMPLATE needs zero connections to the source; drop stray ones (e.g. DataGrip).
  $PG -c "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname='mortgage_pos' AND pid <> pg_backend_pid();" >/dev/null
  $PG -c "CREATE DATABASE \"$DB\" TEMPLATE mortgage_pos;"
fi
printf '[env]\nPOSTGRES_DB = "%s"\n' "$DB" > {{ worktree_path }}/mise.local.toml
mise trust {{ worktree_path }}/mise.local.toml >/dev/null 2>&1 || true
echo "Isolated DB ready: $DB (cloned from mortgage_pos). If this branch adds migrations beyond mortgage_pos, run 'pnpm migrate' or resetWorktreeDB in the worktree."
'''

[[projects."github.com/SageHomeLoans/mortgage-pos".pre-start]]
# Create a 1-pane Servers window (empty workspace; nothing auto-starts).
# Run `wt servers` to split to 6 panes and boot the full stack.
serversWindow = """
[ -n "${WT_REVIEW_ONLY:-}" ] && exit 0
SESSION="{{ vars.session | default(branch | sanitize) }}"
if ! tmux list-windows -t "$SESSION" -F '#W' 2>/dev/null | grep -q '^Servers$'; then
  tmux new-window -d -t "$SESSION" -n "Servers" -c {{ worktree_path }}
fi
"""

[projects."github.com/SageHomeLoans/mortgage-pos".post-start]
# For PR review flow, run pnpm install in the background on pane 0.2
# Claude starts immediately on pane 0.0 while deps install in parallel
reviewDeps = """
[ -z "${WT_REVIEW_ONLY:-}" ] && exit 0
SESSION="{{ vars.session | default(branch | sanitize) }}"
tmux send-keys -t "$SESSION:0.2" "cd {{ worktree_path }} && pnpm install" Enter
"""

[projects."github.com/SageHomeLoans/mortgage-pos".post-switch]
# Kill server PROCESSES in other pos sessions' Servers windows; the pane
# shells and windows stay alive. No auto-respawn — run `wt servers` when
# you need the stack. Only touches sessions with a "Servers" window — sage
# uses "Dev", so the two repos never kill each other's processes.
killOtherServers = """
[ -n "${WT_SKIP_TMUX_SWITCH:-}" ] && exit 0
[ -n "${WT_REVIEW_ONLY:-}" ] && exit 0
SESSION="{{ vars.session | default(branch | sanitize) }}"

kill_tree() {
  local pid="$1"
  for child in $(pgrep -P "$pid" 2>/dev/null); do
    kill_tree "$child"
  done
  kill -9 "$pid" 2>/dev/null || true
}
# Kill descendants of a pane shell, but keep the shell (and pane) alive
kill_children() {
  for child in $(pgrep -P "$1" 2>/dev/null); do
    kill_tree "$child"
  done
}

for s in $(tmux list-sessions -F '#S' 2>/dev/null || true); do
  [ "$s" = "$SESSION" ] && continue
  if tmux list-windows -t "$s" -F '#W' 2>/dev/null | grep -q '^Servers$'; then
    for pid in $(tmux list-panes -t "$s:Servers" -F '#{pane_pid}' 2>/dev/null); do
      kill_children "$pid"
    done
  fi
done
"""

[[projects."github.com/SageHomeLoans/mortgage-pos".pre-remove]]
killServers = """
kill_tree() {
  local pid="$1"
  for child in $(pgrep -P "$pid" 2>/dev/null); do
    kill_tree "$child"
  done
  kill -9 "$pid" 2>/dev/null || true
}
SESSION="{{ vars.session | default(branch | sanitize) }}"
for pid in $(tmux list-panes -t "$SESSION:Servers" -F '#{pane_pid}' 2>/dev/null); do
  kill_tree "$pid"
done
"""

[[projects."github.com/SageHomeLoans/mortgage-pos".pre-remove]]
# Drop this worktree's isolated DB if one exists. IF EXISTS => no-op for shared-DB
# worktrees; the branch-derived name can never match the shared base.
dropDb = '''
DB="mortgage_pos_{{ branch | sanitize_db }}"
[ "$DB" = "mortgage_pos" ] && exit 0
PGPASSWORD=pass psql -h 127.0.0.1 -p 54320 -U user -d postgres -c "DROP DATABASE IF EXISTS \"$DB\" WITH (FORCE);"
'''

[projects."github.com/SageHomeLoans/mortgage-pos".aliases]
# Manual full-stack boot: ensure the Servers window exists with 6 tiled
# panes, then start all 6 servers (staggered to avoid Nx daemon contention).
servers = """
SESSION="{{ vars.session | default(branch | sanitize) }}"
tmux has-session -t "$SESSION" 2>/dev/null || tmux new-session -d -s "$SESSION" -c {{ worktree_path }}
if ! tmux list-windows -t "$SESSION" -F '#W' 2>/dev/null | grep -q '^Servers$'; then
  tmux new-window -d -t "$SESSION" -n "Servers" -c {{ worktree_path }}
fi
while [ "$(tmux list-panes -t "$SESSION:Servers" 2>/dev/null | wc -l)" -lt 6 ]; do
  tmux split-window -d -t "$SESSION:Servers" -c {{ worktree_path }}
  tmux select-layout -t "$SESSION:Servers" tiled
done
tmux send-keys -t "$SESSION:Servers.0" "adminUI" Enter
sleep 3
tmux send-keys -t "$SESSION:Servers.1" "adminAPI" Enter
sleep 2
tmux send-keys -t "$SESSION:Servers.2" "justUI" Enter
sleep 2
tmux send-keys -t "$SESSION:Servers.3" "justAPI" Enter
sleep 2
tmux send-keys -t "$SESSION:Servers.4" "bpUI" Enter
sleep 2
tmux send-keys -t "$SESSION:Servers.5" "bpAPI" Enter
"""

# ============================================================================
# sagehomeloans.com — Next.js site, single "Dev" window; one server at a
# time on :3000, auto-respawned on switch (WT_SKIP_SERVERS=1 to opt out)
# ============================================================================

[[projects."github.com/SageHomeLoans/sagehomeloans.com".pre-start]]
# Symlink node_modules from main worktree (shared deps, no install needed).
# node_modules/ is kept out of copy-ignored via .worktreeinclude in the repo.
# -n: don't dereference an existing symlink (avoids nesting on re-runs)
symNodeModules = """
[ -n "${WT_REVIEW_ONLY:-}" ] && exit 0
ln -sfn {{ primary_worktree_path }}/node_modules {{ worktree_path }}/node_modules
"""

[[projects."github.com/SageHomeLoans/sagehomeloans.com".pre-start]]
# Create the Dev window while blocking (same anti-race as pos serversWindow)
devWindow = """
[ -n "${WT_REVIEW_ONLY:-}" ] && exit 0
SESSION="{{ vars.session | default(branch | sanitize) }}"
if ! tmux list-windows -t "$SESSION" -F '#W' 2>/dev/null | grep -q '^Dev$'; then
  tmux new-window -d -t "$SESSION" -n "Dev" -c {{ worktree_path }}
fi
"""

[projects."github.com/SageHomeLoans/sagehomeloans.com".post-switch]
# Single owner of the Dev pane: kill dev-server PROCESSES in other sage
# sessions (pane shells stay alive), then respawn here. Runs on create AND
# switch; install is a fast no-op sync when the lockfile is unchanged.
killRespawnDev = """
[ -n "${WT_SKIP_TMUX_SWITCH:-}" ] && exit 0
[ -n "${WT_REVIEW_ONLY:-}" ] && exit 0
SESSION="{{ vars.session | default(branch | sanitize) }}"

kill_tree() {
  local pid="$1"
  for child in $(pgrep -P "$pid" 2>/dev/null); do
    kill_tree "$child"
  done
  kill -9 "$pid" 2>/dev/null || true
}
kill_children() {
  for child in $(pgrep -P "$1" 2>/dev/null); do
    kill_tree "$child"
  done
}

for s in $(tmux list-sessions -F '#S' 2>/dev/null || true); do
  [ "$s" = "$SESSION" ] && continue
  if tmux list-windows -t "$s" -F '#W' 2>/dev/null | grep -q '^Dev$'; then
    for pid in $(tmux list-panes -t "$s:Dev" -F '#{pane_pid}' 2>/dev/null); do
      kill_children "$pid"
    done
  fi
done
sleep 1

[ -n "${WT_SKIP_SERVERS:-}" ] && exit 0
# Respawn only if :3000 is free and the Dev pane is idle (never stomp a
# running install or something you started by hand)
lsof -nP -iTCP:3000 -sTCP:LISTEN >/dev/null 2>&1 && exit 0
if ! tmux list-windows -t "$SESSION" -F '#W' 2>/dev/null | grep -q '^Dev$'; then
  tmux new-window -d -t "$SESSION" -n "Dev" -c {{ worktree_path }}
fi
PANE=$(tmux list-panes -t "$SESSION:Dev" -F '#{pane_pid}' 2>/dev/null | head -1)
if [ -n "$PANE" ] && [ -z "$(pgrep -P "$PANE" 2>/dev/null)" ]; then
  tmux send-keys -t "$SESSION:Dev" "pnpm install --prefer-offline && pnpm dev" Enter
fi
"""

[[projects."github.com/SageHomeLoans/sagehomeloans.com".pre-remove]]
killDev = """
kill_tree() {
  local pid="$1"
  for child in $(pgrep -P "$pid" 2>/dev/null); do
    kill_tree "$child"
  done
  kill -9 "$pid" 2>/dev/null || true
}
SESSION="{{ vars.session | default(branch | sanitize) }}"
for pid in $(tmux list-panes -t "$SESSION:Dev" -F '#{pane_pid}' 2>/dev/null); do
  kill_tree "$pid"
done
"""
