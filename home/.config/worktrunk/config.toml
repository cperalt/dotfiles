# Worktrees as sibling directories to the bare repo
# e.g., mortgage-pos/smort-7283-calendly-infra-spin-down
worktree-path = "{{ repo_path }}/../{{ branch | sanitize }}"

[switch]
cd = false

# ============================================================================
# Global hooks — repo-agnostic. Repo-specific steps live under [projects.*]
# below and APPEND after these (global first, then per-project).
#
# Space label (Rex session / Herdr workspace): per-branch override via
#   wt config state vars set session=<nickname> --branch=<branch>
# (main in mortgage-pos = "mpos", main in sagehomeloans.com = "sage-website");
# falls back to the worktree DIRECTORY name, not the branch. gh-stack checks
# out layer branches inside one worktree, so HEAD's branch drifts from the
# directory; the directory is the stable key for the space and the DB.
#
# Multiplexer calls go through wt-mux.sh next to this file. It creates the
# space in whichever multiplexer the hook runs inside (Rex or Herdr) and
# closes it from both, so a worktree removed from the other side is still
# cleaned up.
# ============================================================================

[[pre-start]]
# Copy gitignored caches/deps from main worktree (reflinks on APFS).
# mortgage-pos excludes node_modules/ (symlinked instead — see its entry).
copyIgnore = '[ -n "${WT_REVIEW_ONLY:-}" ] && exit 0; wt step copy-ignored'

[[pre-start]]
mux = """
[ -n "${WT_REVIEW_ONLY:-}" ] && REVIEW=review || REVIEW=
~/.config/worktrunk/wt-mux.sh ensure "{{ vars.session | default(worktree_name) }}" {{ worktree_path }} $REVIEW
"""

[post-switch]
# Focus the space (instant, separate background process)
switchMux = """
[ -n "${WT_SKIP_TMUX_SWITCH:-}" ] && exit 0
~/.config/worktrunk/wt-mux.sh focus "{{ vars.session | default(worktree_name) }}"
"""

[[pre-remove]]
killNvim = """
for pid in $(ps -eo pid,comm | awk '/nvim/{print $1}'); do
  cwd=$(lsof -p "$pid" 2>/dev/null | awk '$4=="cwd"{print $NF}')
  case "$cwd" in
    {{ worktree_path }}*) kill "$pid" 2>/dev/null || true ;;
  esac
done
"""

[post-remove]
# Close the space for the removed worktree, in Rex and Herdr alike. Closing
# tears down its panes, which SIGHUPs anything still running in them
# (including manually started dev servers).
mux = """
~/.config/worktrunk/wt-mux.sh close "{{ vars.session | default(worktree_name) }}"
"""

# gh-stack leaves the `wtn`-created root branch (named after the directory)
# parked on main with no commits once layers take over. `-d` (safe delete)
# removes it only if fully merged, and is a no-op when it was the checked-out
# branch that `wt remove -D` already deleted.
rootBranch = """
[ "{{ worktree_name }}" = "{{ branch }}" ] && exit 0
git -C {{ primary_worktree_path }} branch -d "{{ worktree_name }}" 2>/dev/null || true
"""

# ============================================================================
# mortgage-pos — pnpm monorepo, symlinked node_modules, per-worktree DB
# opt-in.
#
# NOTE (herdr migration): the tmux Servers-window automation (serversWindow,
# killOtherServers, killServers, the `wt servers` alias) was intentionally
# dropped for now — start servers manually in a herdr tab. Closing the
# workspace on removal kills whatever is running in its panes.
# ============================================================================

[projects."github.com/SageHomeLoans/mortgage-pos"]
# node_modules is symlinked from main (below), keep it out of the reflink copy.
# .nx is one gitignored entry, so copy-ignored copies it whole; a nested
# ".nx/workspace-data/" exclude never matches. The nxWorkspaceData hook below
# removes it after the copy instead (it holds the daemon socket pointer, which
# cross-wires the worktree to main's daemon). .nx/cache stays for warm starts.
step.copy-ignored.exclude = ["node_modules/"]

[[projects."github.com/SageHomeLoans/mortgage-pos".pre-start]]
nxWorkspaceData = 'rm -rf {{ worktree_path }}/.nx/workspace-data'

[[projects."github.com/SageHomeLoans/mortgage-pos".pre-start]]
# Symlink node_modules from main worktree (shared deps, no install needed)
symNodeModules = """
[ -n "${WT_REVIEW_ONLY:-}" ] && exit 0
ln -sf {{ primary_worktree_path }}/node_modules {{ worktree_path }}/node_modules
"""

[[projects."github.com/SageHomeLoans/mortgage-pos".pre-start]]
migrations = '[ -n "${WT_REVIEW_ONLY:-}" ] && exit 0; [ -f {{ primary_worktree_path }}/db/migrations-index.ts ] && cp {{ primary_worktree_path }}/db/migrations-index.ts {{ worktree_path }}/db/migrations-index.ts || true'

[[projects."github.com/SageHomeLoans/mortgage-pos".pre-start]]
# Opt-in (the `wtdb` alias sets WT_DB_ISOLATED=1): give this worktree its own
# Postgres DB on the shared local container by cloning the main DB, then
# point its processes at it via a mise env override. No flag => shared mortgage_pos.
isolatedDb = '''
[ -n "${WT_REVIEW_ONLY:-}" ] && exit 0
[ -z "${WT_DB_ISOLATED:-}" ] && exit 0
export PGPASSWORD=pass
PG="psql -h 127.0.0.1 -p 54320 -U user -d postgres -v ON_ERROR_STOP=1"
DB="mortgage_pos_{{ branch | sanitize_db }}"
if ! $PG -tAc "SELECT 1 FROM pg_database WHERE datname='$DB'" | grep -q 1; then
  # CREATE ... TEMPLATE needs zero connections to the source; drop stray ones (e.g. DataGrip).
  $PG -c "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname='mortgage_pos' AND pid <> pg_backend_pid();" >/dev/null
  $PG -c "CREATE DATABASE \"$DB\" TEMPLATE mortgage_pos;"
fi
printf '[env]\nPOSTGRES_DB = "%s"\n' "$DB" > {{ worktree_path }}/mise.local.toml
mise trust {{ worktree_path }}/mise.local.toml >/dev/null 2>&1 || true
echo "Isolated DB ready: $DB (cloned from mortgage_pos). If this branch adds migrations beyond mortgage_pos, run 'pnpm migrate' or resetWorktreeDB in the worktree."
'''

[projects."github.com/SageHomeLoans/mortgage-pos".post-start]
# For PR review flow, run pnpm install in the small bottom pane created by
# the global review layout. Claude starts immediately in the left pane while
# deps install in parallel.
reviewDeps = """
[ -z "${WT_REVIEW_ONLY:-}" ] && exit 0
~/.config/worktrunk/wt-mux.sh run "{{ vars.session | default(worktree_name) }}" pnpm install
"""

[[projects."github.com/SageHomeLoans/mortgage-pos".pre-remove]]
# Drop this worktree's isolated DB if one exists. The name is read back from
# the mise.local.toml the isolatedDb hook wrote, never recomputed from HEAD's
# branch (stacks move HEAD). No file => shared-DB worktree => no-op.
#
# Not done here: deleting the other gh-stack layer branches (<dir>-1-*, <dir>-2-*,
# ...). `wt remove -D` only deletes the checked-out branch; the rest are bare
# refs with no dir/DB/workspace behind them. `gh stack sync --prune` from the
# worktree deletes merged ones. If leftovers get annoying, add a hook here that
# deletes local branches prefixed "$(basename {{ worktree_path }})-" whose PR is MERGED.
dropDb = '''
MISE={{ worktree_path }}/mise.local.toml
[ -f "$MISE" ] || exit 0
DB=$(sed -n 's/^POSTGRES_DB = "\(.*\)"$/\1/p' "$MISE")
[ -z "$DB" ] || [ "$DB" = "mortgage_pos" ] && exit 0
PGPASSWORD=pass psql -h 127.0.0.1 -p 54320 -U user -d postgres -c "DROP DATABASE IF EXISTS \"$DB\" WITH (FORCE);"
'''

# ============================================================================
# sagehomeloans.com — Next.js site.
#
# node_modules: NOT symlinked from main (unlike mortgage-pos). Next 16's
# Turbopack builds its VFS rooted at the project dir and hard-fails on any
# symlink resolving outside it ("points out of the filesystem root").
# Instead node_modules/ is listed in the repo's .worktreeinclude, so the
# global copy-ignored pre-start step reflink-copies it from main (APFS —
# seconds, near-zero disk). No project-specific pre-start hook needed.
#
# NOTE (herdr migration): the tmux Dev-window automation (devWindow,
# killRespawnDev, killDev) was intentionally dropped for now — run
# `pnpm dev` manually in a herdr tab. :3000 single-owner enforcement is
# gone with it; stop the other worktree's server before starting a new one.
# ============================================================================

[list]
summary = false    # Enable LLM branch summaries (requires [commit.generation])
full = false       # Show CI status and LLM summaries (--full)
branches = false   # Include branches without worktrees (--branches)
remotes = false    # Include remote-only branches (--remotes)
columns = ["branch", "path", "status", "ci", "age", "message"]   # path shows the worktree dir; for stacks it differs from branch
timeout-ms = 0     # Wall-clock budget for the entire collect phase; 0 disables
