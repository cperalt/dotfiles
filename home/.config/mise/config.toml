[tools]
node = "latest"
"aqua:temporalio/cli" = "latest"
"npm:@earendil-works/pi-coding-agent" = "latest"
"npm:typescript-language-server" = "latest"
rust = "1.97.1"
bun = "latest"
# CLI tools .zshrc depends on (migrated from Brewfile)
bat = "latest"
eza = "latest"
fd = "latest"
fzf = "latest"
lazygit = "latest"
zoxide = "latest"
jq = "latest"
ripgrep = "latest"
worktrunk = "latest"
yazi = "latest"
rclone = "latest"
"npm:postman-cli" = "latest"

[env]
# Obsidian vault of plans/bugs/area notes, read and written by the `brain`
# agent skill (~/.agents/skills/brain). Local git only, no remote.
BRAIN_VAULT = "{{env.HOME}}/Development/brain"

[hooks]
postinstall = "hash -r"

[settings]
idiomatic_version_file_enable_tools = ["node"]
auto_install = true
experimental = true
dotfiles.root = "~/.dotfiles/home"

[dotfiles]
"~/.config/aerospace" = {}
"~/.config/gh-dash" = { mode = "symlink-each" }
"~/.config/ghostty" = {}
# shared target dirs: link each file, leave unmanaged neighbors alone
"~/.config/herdr" = { mode = "symlink-each" }
"~/.config/herdr-automatic-rename/config.sh" = {}
"~/.config/herdr/plugins/config/beyondlex.herdr-recent-navigator" = { mode = "symlink-each" }
"~/.config/karabiner" = {}
"~/.config/lazygit" = {}
# ~/.config dirs owned wholesale
"~/.config/mise" = {}
"~/.config/nvim" = {}
"~/.config/sesh" = {}
"~/.config/worktrunk" = {}
"~/.config/yazi" = {}
"~/.omp/agent" = { mode = "symlink-each", exclude = ["node_modules", ".DS_Store"] }
"~/.p10k.zsh" = {}
"~/.pi/agent" = { mode = "symlink-each", exclude = ["node_modules", ".DS_Store"] }
"~/.tmux.conf" = {}
"~/.wezterm.lua" = {}
# $HOME-root files
"~/.zshrc" = {}
