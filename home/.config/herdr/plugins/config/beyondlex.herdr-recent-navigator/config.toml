# Herdr Recent Navigator settings. Read by the plugin at launch via
# $HERDR_PLUGIN_CONFIG_DIR; the installer never touches this file.

[navigator]
# Tabs shown in the header, in order. Valid: workspaces, tabs, panes, agents, all.
tabs = ["workspaces", "agents"]

[keybindings]
move_up = ["Up", "C-k", "C-p"]
move_down = ["Down", "C-j", "C-n"]
next_category = ["Tab", "C-l"]
previous_category = ["S-Tab", "C-h"]
