# Reference: `herdr --default-config`. Reload: prefix + Shift-R
onboarding = false

[theme]
name = "tokyo-night"

[theme.custom]
# Active space name; tokyo-night's text/subtext0 are too close to tell apart.
text = "#9ece6a"

# Keys mirror ~/.dotfiles/tmux/.tmux.conf.
[keys]
prefix = "ctrl+a"

split_vertical = "prefix+|"
split_horizontal = "prefix+minus"
detach = "prefix+d"
reload_config = "prefix+r"
resize_mode = "prefix+shift+r"
zoom = ["prefix+m", "prefix+z"]
copy_mode = ["prefix+v", "prefix+["]
rename_tab = "prefix+comma"
close_tab = "prefix+ampersand"
goto = "prefix+O"

# vim-herdr-navigation; nvim side in nvim/.config/nvim/lua/carlos/plugins/tmux-navigator.lua
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "navigate right (vim/herdr)"

[ui]
pane_borders = false
pane_gaps = true
hide_tab_bar_when_single_tab = true

agent_panel_sort = "priority"
[ui.sidebar.spaces]
# One line per space; branch is redundant with worktrunk branch-named workspaces.
rows = [["state_icon", "workspace", "git_status"]]
